server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;
    gzip_min_length 512;

    # الصور والموسيقى مش هتتغير كتير، فتتخزن عند الضيف أسبوع
    location ~* \.(jpg|jpeg|png|webp|mp3)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # الصفحات والكود يتجددوا على طول عشان أي تعديل يوصل للضيوف فورًا
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # صفحة مولد اللينكات مش للضيوف
    location = /links.html {
        add_header X-Robots-Tag "noindex, nofollow";
        add_header Cache-Control "no-cache";
    }

    location = /healthz { access_log off; return 200 "ok"; }

    location / { try_files $uri $uri/ /index.html; }
}
